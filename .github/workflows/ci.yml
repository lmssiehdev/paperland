name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Typecheck, lint, format, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run format:check
      - run: bun run build

  # Game logic, protocol, server rooms, golden hash and dependency rules, all in Bun. Core uses trig.ts
  # (pure IEEE double math), so results do not depend on the CPU and no browser is needed.
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run test:unit

  changes:
    name: Detect Chromium-relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      chromium: ${{ steps.filter.outputs.chromium }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: filter
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          # bun.lock pins Playwright, hence Chromium; engine/ holds trig.ts.
          paths='^(bun\.lock|packages/core/src/engine/|packages/core/test/(trig|golden)|packages/e2e/|\.github/)'
          if [ "${{ github.event_name }}" = workflow_dispatch ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "chromium=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE" HEAD | grep -qE "$paths"; then
            echo "chromium=true" >> "$GITHUB_OUTPUT"
          else
            echo "chromium=false" >> "$GITHUB_OUTPUT"
          fi

  # Only when Chromium or the trig port can change: trig.ts bit-exact with Chromium's Math.*, the golden
  # scenario in Chromium, and parity with the original game over 6 seeds.
  # arm64 on purpose: trig.ts follows arm64 Chromium (atan2's FMA path); x86-64 Chromium may differ in the last bit.
  chromium:
    name: Chromium (trig, golden, parity)
    needs: changes
    if: needs.changes.outputs.chromium == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    env:
      BASE_URL: http://localhost:3000/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - uses: ./.github/actions/playwright
      - run: bun run test:chromium
      # parity drives the game through window.paperio2api, which only dev builds expose.
      - run: bun run build:dev
      - name: Start server
        run: |
          bun run serve > server.log 2>&1 &
          for _ in $(seq 30); do
            curl --silent --fail --output /dev/null "$BASE_URL" && exit 0
            sleep 1
          done
          echo "Server did not start in 30 s"
          cat server.log
          exit 1
      - run: bun run parity 6
      - name: Server log
        if: failure()
        run: cat server.log
